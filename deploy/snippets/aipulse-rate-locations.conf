# AI Pulse — 严限流 location（由 aipulse.conf 的 server {} 内 include 引入）
# 须写在 location /api/ 之前；proxy_pass 与主站 /api/ 块配合使用。

location = /api/subscribe {
    limit_req zone=aipulse_api_write burst=6 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

location = /api/feedback {
    limit_req zone=aipulse_api_write burst=6 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128k;
}

location = /admin/auth/login {
    limit_req zone=aipulse_api_write burst=8 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}

# 动态 sitemap：须命中后端，避免 SPA 兜底返回 index.html。
location = /sitemap.xml {
    limit_req zone=aipulse_api_read burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
