# AI Pulse — Nginx 限流示例（贴到服务器前请先 nginx -t）
#
# 用法概要：
# 1) 将下方「http 块」两段 limit_req_zone 复制到 /etc/nginx/nginx.conf 的 http { } 内（若尚未定义）。
# 2) 将「server 块」内容合并进 /etc/nginx/conf.d/aipulse.conf 的 server { } 内，
#    放在现有 location /api/ 与 /admin/ 之前或替换其中的 limit_req（按你当前反代结构调整）。
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# 说明：limit_req 按客户端 IP（$binary_remote_addr）；若 Nginx 前还有 CDN/SLB，
# 需确保 X-Forwarded-For 可信，或改用 $http_x_forwarded_for 并配置 real_ip（此处不展开）。

# ---------- http 块（/etc/nginx/nginx.conf）----------

# 公开读接口：约 40 r/s，突发 80（首页+榜单多请求）
limit_req_zone $binary_remote_addr zone=aipulse_api_read:10m rate=40r/s;

# 写接口 / 登录：约 2 r/s，突发 8（订阅、反馈、管理登录）
limit_req_zone $binary_remote_addr zone=aipulse_api_write:10m rate=2r/s;

# ---------- server 块（aipulse.conf）----------

# 更严：订阅（防刷邮件）
location = /api/subscribe {
    limit_req zone=aipulse_api_write burst=6 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

# 更严：用户反馈
location = /api/feedback {
    limit_req zone=aipulse_api_write burst=6 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128k;
}

# 更严：管理后台登录（路径以你反代为准，常见为 /admin/auth/login）
location = /admin/auth/login {
    limit_req zone=aipulse_api_write burst=8 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}

# 其余 /api/（榜单、周报、埋点等）
location /api/ {
    limit_req zone=aipulse_api_read burst=80 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 256k;
}

# 若已有「兜底 SPA」location / { try_files ... }，请勿删除；以上 location 优先级更高。
